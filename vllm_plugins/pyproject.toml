[project]
name = "local-llm-plugins"
version = "1"
description = "vLLM attention fixes and measured 8060S kernel improvements"

[project.entry-points."vllm.general_plugins"]
local_llm_attention = "local_llm_attention:register"
local_llm_tools = "local_llm_tools:register"
local_llm_kernels = "local_llm_kernels:register"
local_llm_rdna = "local_llm_rdna:register"
local_llm_reasoning = "local_llm_reasoning:register"

[tool.setuptools]
py-modules = ["local_llm_attention", "local_llm_tools", "local_llm_kernels", "local_llm_dense", "local_llm_moe", "local_llm_encoder", "local_llm_rdna", "local_llm_reasoning"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
