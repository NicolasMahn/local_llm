[project]
name = "local-llm-attention"
version = "1"
description = "Fast long-context prefill attention for Gemma 4 on Strix Halo"

[project.entry-points."vllm.general_plugins"]
local_llm_attention = "local_llm_attention:register"

[tool.setuptools]
py-modules = ["local_llm_attention"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
